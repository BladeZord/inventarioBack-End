# =========================================
# Configuración para TEST (H2 en memoria)
# =========================================
spring.application.name=inventarios-app-test

# H2 en memoria, modo PostgreSQL para mayor compatibilidad de sintaxis
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Deshabilitar inicialización de scripts en test
spring.sql.init.mode=never

# Evitar logs ruidosos en test (opcional)
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

